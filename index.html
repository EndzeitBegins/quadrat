<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hochzeit von Lisa & Lucas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="starfield"></canvas>

    <div class="moon"></div>

    <div class="overlay">
        <div class="container">
            <header class="wedding-header">
                <p class="invitation-title">Einladung zur freien Trauung</p>
                <p class="von">von</p>
                <div class="names">
                    <span class="name">li &amp; lu</span>
                </div>
                <div class="ornament">✦</div>
                <p class="date-info">xxx</p>
            </header>

            <section class="rsvp-section">
                <div class="ornament">✦</div>
                <h2>Teilnahmebestätigung</h2>
                <p class="section-text">Bitte lasst uns wissen, ob ihr an diesem besonderen Tag dabei sein könnt.</p>
                <div class="form-wrapper">
                    <iframe 
                        src="https://docs.google.com/forms/d/e/1FAIpQLSccSx-tGrveWrtR9mpwQyFbI97F4h1-W0TX__o46br595HjiA/viewform?embedded=true" 
                        width="640" 
                        height="384" 
                        frameborder="0" 
                        marginheight="0" 
                        marginwidth="0">
                        Wird geladen…
                    </iframe>
                </div>
            </section>

            <footer class="wedding-footer">
                <p>Wir freuen uns darauf, mit euch unter den Sternen zu feiern.</p>
                <div class="ornament">✦</div>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
